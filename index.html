<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VS Code Clone</title>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="top-bar">
      <div class="menu-left">
        <span>File</span>
        <span>Edit</span>
        <span>Selection</span>
        <span>View</span>
        <span>Go</span>
        <span>Run</span>
      </div>

      <div class="menu-center">
        <input type="text" placeholder="  🔍  vs code clone" />
      </div>

      <div class="menu-right">
        <i class="fa-regular fa-square"></i>
        <i class="fa-regular fa-window-maximize"></i>
        <i class="fa-solid fa-xmark"></i>
      </div>
    </div>

    <div class="container">
      <div class="activity-bar">
        <i class="fa-regular fa-file"></i>
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-brands fa-github"></i>
        <i class="fa-solid fa-bug"></i>
        <i class="fa-solid fa-puzzle-piece"></i>
        <i class="fa-solid fa-gear"></i>
      </div>

      <div class="side-bar">
        <h4>EXPLORER</h4>

        <ul class="explorer-section">
          <li><i class="fa-solid fa-chevron-right"></i> OUTLINE</li>
          <li><i class="fa-solid fa-chevron-right"></i> VS CODE CLONE</li>
          <li><i class="fa-solid fa-chevron-right"></i> TIMELINE</li>
        </ul>
      </div>

      <div class="editor">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Visual_Studio_Code_1.35_icon.svg"
        />

        <div class="shortcuts">
          <p>
            Show All Commands  <span>Ctrl</span> + <span>Shift</span> +
            <span>P</span>
          </p>
          <p>Go to File <span>Ctrl</span> + <span>P</span></p>
          <p>
            Open Chat  <span>Ctrl</span> + <span>Alt</span> +
            <span>I</span>
          </p>
          <p>Toggle Terminal  <span>Ctrl</span> + <span>'</span></p>
          <p>Open Settings  <span>Ctrl</span> + <span>,</span></p>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-left">
        <i class="fa-solid fa-code-branch"></i> main
        <i class="fa-solid fa-warning"></i> 0 <i class="fa-solid fa-bug"></i> 0
      </div>

      <div class="status-right"><i class="fa-solid fa-sun"></i> 25°C Sunny</div>
    </div>
  </body>
</html>
